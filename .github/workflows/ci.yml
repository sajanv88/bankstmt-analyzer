name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job here writes anything back to the repository.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  build:
    name: Vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  generate:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: sqlc diff
        # Fails when internal/db no longer matches the queries and schema
        # it was generated from.
        run: sqlc diff

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: swag init diff
        # Regenerate and fail if anything changed, so docs/ cannot drift
        # from the handler annotations.
        run: |
          swag init --generalInfo cmd/api/main.go --output docs --parseInternal --parseDependency
          git diff --exit-code docs/

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bankstmt
          POSTGRES_PASSWORD: bankstmt
          POSTGRES_DB: bankstmt
        ports:
          - 5432:5432
        # Without this the first test can connect before Postgres is ready.
        options: >-
          --health-cmd "pg_isready -U bankstmt -d bankstmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start MinIO
        # Run as a plain container rather than a service container: the
        # minio image needs `server /data` as its command, and service
        # containers cannot override one.
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=bankstmt             -e MINIO_ROOT_PASSWORD=bankstmt123             minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c             "mc alias set ci http://localhost:9000 bankstmt bankstmt123 &&              mc mb --ignore-existing ci/bankstmt-uploads"

      - name: go test -race
        # DATABASE_URL un-skips the integration tests that exercise the
        # visualization SQL against real Postgres; S3_ENDPOINT and
        # S3_BUCKET un-skip the object-store half of the BlobStore
        # conformance suite, so both backends are held to the same
        # contract on every run.
        env:
          DATABASE_URL: postgres://bankstmt:bankstmt@localhost:5432/bankstmt?sslmode=disable
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: bankstmt-uploads
          S3_ACCESS_KEY_ID: bankstmt
          S3_SECRET_ACCESS_KEY: bankstmt123
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: helm lint
        # Every values file under ci/ is a configuration the chart claims
        # to support, so each one is linted and rendered.
        run: |
          for values in deploy/helm/bankstmt-analyzer/ci/*.yaml; do
            echo "== $values"
            helm lint deploy/helm/bankstmt-analyzer --values "$values"
          done

      - name: helm template
        run: |
          for values in deploy/helm/bankstmt-analyzer/ci/*.yaml; do
            helm template ci-check deploy/helm/bankstmt-analyzer --values "$values" > /dev/null
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Verification only: nothing is published from CI.
          push: false
          load: true
          tags: bankstmt-analyzer:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs
        run: docker run --rm bankstmt-analyzer:ci --version
