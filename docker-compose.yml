# Local development dependencies. The service itself runs on the host via
# `make run`, so a code change needs no image rebuild.
services:
  postgres:
    image: postgres:16
    container_name: bankstmt-postgres
    environment:
      POSTGRES_USER: bankstmt
      POSTGRES_PASSWORD: bankstmt
      POSTGRES_DB: bankstmt
    ports:
      # Overridable because 5432 is often already taken by a system-wide
      # Postgres. Set POSTGRES_PORT in .env and match it in DATABASE_URL;
      # compose and the Makefile both read that file.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, `docker compose up -d` returns before Postgres is
      # accepting connections and the first `make run` fails its ping.
      test: ["CMD-SHELL", "pg_isready -U bankstmt -d bankstmt"]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:latest
    container_name: bankstmt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bankstmt
      MINIO_ROOT_PASSWORD: bankstmt123
    ports:
      - "${MINIO_PORT:-9000}:9000"
      # Browser console, handy for looking at what was uploaded.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is up, then exits. Without it the service
  # would fail its startup bucket check on a fresh volume.
  minio-init:
    image: minio/mc:latest
    container_name: bankstmt-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bankstmt bankstmt123 &&
      mc mb --ignore-existing local/bankstmt-uploads &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
