# Default values for bankstmt-analyzer.

image:
  repository: ghcr.io/sajanv88/bankstmt-analyzer
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion, which CI sets from the release tag.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ENV; anything other than "production" also serves the Swagger UI.
env: production
logLevel: info

# Extra plain (non-secret) environment variables for every workload, for
# the tunables in .env.example that this chart does not surface directly.
extraEnv: {}
  # WORKER_CONCURRENCY: "8"
  # TASKQ_LEASE_DURATION: "20m"

config:
  # Name of an existing Secret holding the credentials. It must provide
  # these keys, which are the environment variable names the service reads:
  #
  #   DATABASE_URL, AZURE_OCR_ENDPOINT, AZURE_OCR_API_KEY, AZURE_OCR_MODEL,
  #   AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY, AZURE_OPENAI_DEPLOYMENT
  #
  # Recommended for anything real: it keeps credentials out of values files
  # and out of Helm's release history. Leave empty to have the chart create
  # a Secret from the values below instead.
  existingSecret: ""

  databaseUrl: ""
  azure:
    ocrEndpoint: ""
    ocrApiKey: ""
    ocrModel: mistral-ocr-2503
    ocrPath: ""
    openaiEndpoint: ""
    openaiApiKey: ""
    openaiDeployment: ""
    openaiApiVersion: ""

storage:
  # "s3" or "local".
  #
  # s3 is the right choice here. The API writes an upload's PDFs and the
  # worker reads them, and since they are separate Deployments the local
  # backend only works if both mount the same ReadWriteMany volume. With
  # an object store they simply share a bucket. Any S3-compatible service
  # will do: MinIO, AWS S3, Ceph, R2.
  backend: s3

  # Only used when backend is "local". Must be writable by uid 65532, the
  # nonroot user the distroless image runs as.
  dir: /data/uploads
  persistence:
    # Only consulted when backend is "local". Without a ReadWriteMany
    # claim each pod gets a private emptyDir, the worker cannot see what
    # the API wrote, and every upload fails at the OCR step.
    enabled: false
    existingClaim: ""
    accessModes:
      - ReadWriteMany
    size: 10Gi
    storageClass: ""

  s3:
    # Service URL, for example http://minio.minio.svc.cluster.local:9000.
    # Leave empty for AWS S3, where the region resolves the endpoint.
    endpoint: ""
    bucket: bankstmt-uploads
    # Required by request signing even where the store ignores it.
    region: us-east-1
    # MinIO and most S3-compatible stores need path-style addressing;
    # set false for AWS S3 proper.
    usePathStyle: true
    # Optional key prefix, so one bucket can host several environments.
    prefix: ""
    # Credentials. As with the Azure keys these belong in
    # config.existingSecret, under S3_ACCESS_KEY_ID and
    # S3_SECRET_ACCESS_KEY; these values are only for a chart-managed
    # Secret.
    accessKeyId: ""
    secretAccessKey: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bankstmt-analyzer.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Applied to every pod. The image already runs as nonroot; these make that
# explicit to admission controllers and drop everything not needed.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  annotations: {}
  name: ""

api:
  replicaCount: 2
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicaCount: 1
  podAnnotations: {}
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  # A saga hop can be a multi-minute OCR or model call, so the worker is
  # given room to finish one before it is killed.
  terminationGracePeriodSeconds: 120
  nodeSelector: {}
  tolerations: []
  affinity: {}

migration:
  # Runs `--migrate --api=false --worker=false` as a pre-install and
  # pre-upgrade hook, so the schema is in place before any new pod starts.
  # Migrations take a Postgres advisory lock, so this is safe even if a pod
  # with MIGRATE_ON_START also tries.
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
