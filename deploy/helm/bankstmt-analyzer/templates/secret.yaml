{{- if not .Values.config.existingSecret }}
{{- /*
Only rendered when no existing Secret was supplied. Values land in Helm's
release history, so config.existingSecret is the better choice for any
real deployment.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bankstmt-analyzer.secretName" . }}
  labels:
    {{- include "bankstmt-analyzer.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "config.databaseUrl is required unless config.existingSecret is set" .Values.config.databaseUrl | quote }}
  API_KEY: {{ required "config.apiKey is required unless config.existingSecret is set" .Values.config.apiKey | quote }}
  AZURE_OCR_ENDPOINT: {{ required "config.azure.ocrEndpoint is required unless config.existingSecret is set" .Values.config.azure.ocrEndpoint | quote }}
  AZURE_OCR_API_KEY: {{ required "config.azure.ocrApiKey is required unless config.existingSecret is set" .Values.config.azure.ocrApiKey | quote }}
  AZURE_OCR_MODEL: {{ required "config.azure.ocrModel is required unless config.existingSecret is set" .Values.config.azure.ocrModel | quote }}
  AZURE_OPENAI_ENDPOINT: {{ required "config.azure.openaiEndpoint is required unless config.existingSecret is set" .Values.config.azure.openaiEndpoint | quote }}
  AZURE_OPENAI_API_KEY: {{ required "config.azure.openaiApiKey is required unless config.existingSecret is set" .Values.config.azure.openaiApiKey | quote }}
  AZURE_OPENAI_DEPLOYMENT: {{ required "config.azure.openaiDeployment is required unless config.existingSecret is set" .Values.config.azure.openaiDeployment | quote }}
  {{- with .Values.config.azure.ocrPath }}
  AZURE_OCR_PATH: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.azure.openaiApiVersion }}
  AZURE_OPENAI_API_VERSION: {{ . | quote }}
  {{- end }}
  {{- if eq .Values.storage.backend "s3" }}
  S3_ACCESS_KEY_ID: {{ required "storage.s3.accessKeyId is required unless config.existingSecret is set" .Values.storage.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "storage.s3.secretAccessKey is required unless config.existingSecret is set" .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
