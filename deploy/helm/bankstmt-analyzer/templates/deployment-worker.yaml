apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bankstmt-analyzer.fullname" . }}-worker
  labels:
    {{- include "bankstmt-analyzer.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bankstmt-analyzer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "bankstmt-analyzer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- if not .Values.config.existingSecret }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bankstmt-analyzer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # One saga hop can be a multi-minute OCR or model call. The pool
      # stops dequeuing on SIGTERM and waits for in-flight hops, so this
      # should exceed the slowest single step.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "bankstmt-analyzer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # No ports and no HTTP probes: the worker serves nothing. Its
          # liveness is the queue draining, which Kubernetes cannot see.
          env:
            {{- include "bankstmt-analyzer.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "bankstmt-analyzer.secretName" . }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.storage.backend "local" }}
            - name: uploads
              mountPath: {{ .Values.storage.dir }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if eq .Values.storage.backend "local" }}
        - name: uploads
          {{- if .Values.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-uploads" (include "bankstmt-analyzer.fullname" .)) .Values.storage.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
