apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bankstmt-analyzer.fullname" . }}-api
  labels:
    {{- include "bankstmt-analyzer.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bankstmt-analyzer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "bankstmt-analyzer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- if not .Values.config.existingSecret }}
        # Rolls the pods when the chart-managed Secret changes; an existing
        # Secret is the operator's to roll, since the chart cannot see it.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bankstmt-analyzer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "bankstmt-analyzer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "bankstmt-analyzer.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "bankstmt-analyzer.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # /readyz pings the database, so a pod whose database is
            # unreachable leaves the Service rather than serving errors.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            # Covers a slow first connection without making the liveness
            # probe lenient for the rest of the pod's life.
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.storage.backend "local" }}
            - name: uploads
              mountPath: {{ .Values.storage.dir }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if eq .Values.storage.backend "local" }}
        - name: uploads
          {{- if .Values.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-uploads" (include "bankstmt-analyzer.fullname" .)) .Values.storage.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        # The root filesystem is read-only, and multipart handling needs
        # somewhere to spill.
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
