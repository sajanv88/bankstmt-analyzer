{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bankstmt-analyzer.serviceAccountName" . }}
  labels:
    {{- include "bankstmt-analyzer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The service talks only to Postgres and to Azure; it never calls the
# Kubernetes API, so it has no need of a mounted token.
automountServiceAccountToken: false
{{- end }}
